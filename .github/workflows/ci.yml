name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Go Test & Coverage
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      
      - name: Download dependencies
        run: go mod download
      
      - name: Run tests with coverage
        run: |
          go test ./... -race -covermode=atomic -coverprofile=build/repoors/coverage.out
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: build/repoors/coverage.out
          fail_ci_if_error: false
